<!DOCTYPE html>
<html>
<head>
    <title>HR Login</title>

    <style>
        body{
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            padding:40px;
            border-radius:10px;
            width:350px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:20px;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>HR Login</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
